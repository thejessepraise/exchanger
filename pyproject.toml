[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exchanger"
version = "0.1.0"
description = "A simple, extensible Python library for converting between currencies using live exchange rates."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "thejessepraise", email = "jesseyankson86@gmail.com" },
]
keywords = ["currency", "exchange-rate", "forex", "converter", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.urls]
Homepage = "https://github.com/thejessepraise/exchanger"
Issues = "https://github.com/thejessepraise/exchanger/issues"

[tool.setuptools.packages.find]
include = ["exchanger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
